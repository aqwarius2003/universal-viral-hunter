[project]
name = "viral-hunter"
version = "2.2.3"
description = "Viral Hunter with LangGraph"
authors = [
    {name = "aqwarius2003",email = "00victorr@gmail.com"}
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "langchain-core (>=1.6.3,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "aiogram (>=3.31.0,<4.0.0)",
    "google-genai (>=2.23.0,<3.0.0)",
    "twifork (>=2.4.0,<3.0.0)",
    "playwright (>=1.40.0,<2.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
[dependency-groups]
dev = [
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
