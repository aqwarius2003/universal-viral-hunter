services:
  viral-hunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viral-hunter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/tweets.sqlite
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tbilisi
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage for SQLite database, settings, and X.com cookies
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/setup_status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: viral-hunter-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - viral-hunter

volumes:
  caddy_data:
  caddy_config:
